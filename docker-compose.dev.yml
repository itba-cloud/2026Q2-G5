services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudgame
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudgame"]
      interval: 5s
      timeout: 5s
      retries: 10
