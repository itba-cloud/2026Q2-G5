# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# tfsec quedó deprecado y su parser no entiende los bloques `ephemeral` de
# Terraform >= 1.10 (infra/secrets.tf). Se usa Trivy, su sucesor oficial,
# con el mismo esquema: reporte SARIF a Code scanning y resumen en el PR.

name: Terraform Security

on:
  pull_request:

jobs:
  tfsec-run:
    name: Run trivy sarif report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Run trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with: # Path to SARIF file relative to the root of the repository
          sarif_file: trivy.sarif
          github_token: ${{ secrets.GITHUB_TOKEN }}

  tf-comments:
    name: Terraform Security summary
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Run trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: table
          output: trivy.txt
          exit-code: '0' # soft fail: informa, no bloquea el PR

      - name: Publish summary
        run: |
          {
            echo "## Terraform Security (trivy config infra)"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
