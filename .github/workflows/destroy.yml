name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "destroy" para confirmar la destrucción'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-lab
  cancel-in-progress: false

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    timeout-minutes: 120

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      # Solo verifica el bucket de estado; Destroy nunca crea un backend.
      - name: Verify the state bucket
        id: state
        run: |
          out="$(python3 scripts/bootstrap-state-backend.py --check-only)"
          echo "$out"
          echo "bucket=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["bucket"])')" >> "$GITHUB_OUTPUT"

      - name: Init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=elastic-worlds/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Destroy
        run: terraform -chdir=infra destroy -auto-approve
