# ----------------------------------------------------------------------------------
# Dependabot configurations:
# Enable version updates for terraform, looking for different files in every
# specified directory, with a weekly schedule and a security label
# ----------------------------------------------------------------------------------

version: 2
updates:
  # --------------------------------------------------------------
  #  Terraform root module in infra/
  # --------------------------------------------------------------
  - package-ecosystem: 'terraform'
    directory: '/infra'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: "*"
        update-types: ['version-update:semver-minor']
    labels:
      - 'security'

  # ----------------------------------------------------------------------
  # Check for workflow files in .github/workflows` path
  # ----------------------------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: "*"
        update-types: ['version-update:semver-minor']
    labels:
      - 'github-actions'
